<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gba-shadow 3D</title>
<style>
  :root { --bg: #111318; --panel: rgba(17, 19, 24, 0.85); --text: #e6e8ee; --muted: #9aa0ad; --accent: #ff5ca8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; max-width: min(360px, calc(100vw - 48px));
    background: var(--panel); border: 1px solid #2a2e38; border-radius: 8px; padding: 10px 12px; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #status { color: var(--muted); margin-bottom: 8px; }
  #status.ok { color: #7bd88f; }
  label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  input[type=range] { flex: 1; }
  pre { margin: 8px 0 0; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; color: var(--muted); max-height: 40vh; overflow: auto; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="panel">
  <h1>gba-shadow 3D</h1>
  <div id="status">connecting…</div>
  <label><input id="hide" type="checkbox" checked> hide original entity sprites</label>
  <label>tilt <input id="tilt" type="range" min="0" max="80" value="50"></label>
  <pre id="info"></pre>
</div>
<script type="module">
import * as THREE from "three";

const W = 240, H = 160;
const statusEl = document.getElementById("status");
const infoEl = document.getElementById("info");
const hideEl = document.getElementById("hide");
const tiltEl = document.getElementById("tilt");

// --- scene: the GBA picture lies flat as a floor, entities stand on it -------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111318);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 2000);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-80, 200, 120);
scene.add(sun);

const pixels = new Uint8Array(W * H * 4);
const texture = new THREE.DataTexture(pixels, W, H, THREE.RGBAFormat);
texture.magFilter = THREE.NearestFilter;
texture.minFilter = THREE.NearestFilter;
texture.colorSpace = THREE.SRGBColorSpace;
const floorGeo = new THREE.PlaneGeometry(W, H);
const uv = floorGeo.attributes.uv;            // image rows run top -> bottom
for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i));
const floor = new THREE.Mesh(floorGeo, new THREE.MeshBasicMaterial({ map: texture }));
floor.rotation.x = -Math.PI / 2;               // screen (x, y) -> world (x - 120, 0, y - 80)
scene.add(floor);

const frameEdge = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(W, 0.01, H)),
  new THREE.LineBasicMaterial({ color: 0x3a3f4b }));
scene.add(frameEdge);

// --- entities: a cube with a "nose" pointing where the entity faces -----------
const COLORS = { player: 0xff5ca8 };
const FACING_YAW = { down: 0, right: Math.PI / 2, up: Math.PI, left: -Math.PI / 2 };
const actors = new Map();

function makeActor(e) {
  const size = Math.max(8, (e.size ? e.size[0] : 16) * 0.85);
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(size, size, size),
    new THREE.MeshStandardMaterial({ color: COLORS[e.kind] ?? 0x5cc8ff, roughness: 0.5 }));
  body.position.y = size / 2;
  const nose = new THREE.Mesh(new THREE.ConeGeometry(size * 0.22, size * 0.45, 16),
    new THREE.MeshStandardMaterial({ color: 0xffffff }));
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, size * 0.6, size * 0.6);
  group.add(body, nose);
  group.userData = { size, target: new THREE.Vector3(), yaw: 0, moving: false, phase: 0, body };
  scene.add(group);
  return group;
}

function updateActors(entities) {
  const seen = new Set();
  for (const e of entities) {
    if (!e.screen) continue;
    seen.add(e.id);
    let a = actors.get(e.id);
    if (!a) { a = makeActor(e); actors.set(e.id, a); a.position.set(e.screen[0] - W / 2, 0, e.screen[1] - H / 2); }
    const d = a.userData;
    d.target.set(e.screen[0] - W / 2, 0, e.screen[1] - H / 2 - d.size / 2);
    if (e.facing in FACING_YAW) d.yaw = FACING_YAW[e.facing];
    d.moving = e.moving;
  }
  for (const [id, a] of actors) {
    if (!seen.has(id)) { scene.remove(a); actors.delete(id); }
  }
}

// --- networking ----------------------------------------------------------------
let ws, frames = 0, lastMeta = null;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { ws.send(JSON.stringify({ hide_entity_sprites: hideEl.checked })); };
  ws.onmessage = (ev) => {
    const view = new DataView(ev.data);
    const n = view.getUint32(0, true);
    const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(ev.data, 4, n)));
    pixels.set(new Uint8Array(ev.data, 4 + n, meta.width * meta.height * 4));
    texture.needsUpdate = true;
    updateActors(meta.entities);
    lastMeta = meta;
    frames++;
  };
  ws.onclose = () => { statusEl.textContent = "disconnected - retrying…"; statusEl.className = ""; setTimeout(connect, 1000); };
}
connect();
hideEl.onchange = () => ws?.readyState === 1 && ws.send(JSON.stringify({ hide_entity_sprites: hideEl.checked }));

setInterval(() => {
  if (!lastMeta) { statusEl.textContent = "connected - waiting for frames from mGBA…"; return; }
  statusEl.className = "ok";
  statusEl.textContent = `${lastMeta.game ?? "?"} · frame ${lastMeta.frame} · ${frames} fps`;
  frames = 0;
  const p = lastMeta.entities[0];
  infoEl.textContent = p ? JSON.stringify(p, null, 1) : (lastMeta.error ?? "no entities (not in the overworld?)");
}, 1000);

// --- render loop ---------------------------------------------------------------
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const tilt = THREE.MathUtils.degToRad(Number(tiltEl.value));
  const dist = 270;
  camera.position.set(0, Math.cos(tilt) * dist, Math.sin(tilt) * dist);
  camera.lookAt(0, 0, 0);
  for (const a of actors.values()) {
    const d = a.userData;
    a.position.lerp(d.target, 1 - Math.exp(-dt * 25));
    let dy = d.yaw - a.rotation.y;
    dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    a.rotation.y += dy * (1 - Math.exp(-dt * 15));
    d.phase = d.moving ? d.phase + dt * 14 : 0;
    d.body.position.y = d.size / 2 + Math.abs(Math.sin(d.phase)) * d.size * 0.15;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
